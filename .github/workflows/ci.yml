name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install blpapi (Bloomberg public index)
        run: pip install --index-url=https://blpapi.bloomberg.com/repository/releases/python/simple blpapi

      - name: Install build and test tools
        run: pip install build pytest pytest-cov ruff "sphinx>=7.2"

      - name: Build distribution
        run: python -m build

      - name: Install built wheel
        run: pip install dist/*.whl

      - name: Lint
        run: ruff check src/bbg_fetch tests examples

      - name: Test
        run: pytest tests/

      - name: Compile every example
        run: python -m compileall -q examples

      - name: Run terminal-free example against installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/examples/quickstart_no_terminal.py"

      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Check documentation links
        run: python -m sphinx -W --keep-going -b linkcheck docs docs/_build/linkcheck
