[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bbg-fetch"
version = "3.1.0"
description = "Bloomberg Desktop API request/response data in pandas DataFrames for quantitative research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Artur Sepp", email = "artursepp@gmail.com"},
]
maintainers = [
    {name = "Artur Sepp", email = "artursepp@gmail.com"},
]
keywords = [
    "bloomberg",
    "bloomberg api",
    "financial data",
    "market data",
    "implied volatility",
    "quantitative finance",
    "blpapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.2",
]

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
lint = [
    "ruff==0.16.2",
]

[project.urls]
Homepage = "https://github.com/ArturSepp/BloombergFetch"
Repository = "https://github.com/ArturSepp/BloombergFetch"
Documentation = "https://bloombergfetch.readthedocs.io"
Issues = "https://github.com/ArturSepp/BloombergFetch/issues"
Changelog = "https://github.com/ArturSepp/BloombergFetch/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["bbg_fetch*"]
exclude = [
    "tests*",
    "docs*",
    "bbg_fetch.tests*",
    "bbg_fetch.run_local*",
    "bbg_fetch.*.run_local*",
    "bbg_fetch.*.*.run_local*",
    "bbg_fetch.*.*.*.run_local*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --tb=short"
cache_dir = "~/.cache/bbg-fetch/pytest"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
extend-ignore = ["E501"]  # line length not enforced; existing code has many long lines

# --- stack invariants as lint, not prose ---------------------------------------------------
# TID251 bans an import outright, TID253 bans it only at module level, and ICN pins the numpy and
# pandas aliases. None belongs to the "I" (isort) family, so the import-grouping convention is
# untouched. Verified green on the repository as it stands.
extend-select = ["TID251", "TID253", "ICN"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# A1: bbg-fetch is a leaf. blpapi only, no stack dependencies in either direction.
"qis".msg = "A1: bbg-fetch is a leaf with no stack dependencies."
"optimalportfolios".msg = "A1: bbg-fetch is a leaf with no stack dependencies."
"factorlasso".msg = "A1: bbg-fetch is a leaf with no stack dependencies."
"trendfollowing".msg = "A1: bbg-fetch is a leaf with no stack dependencies."
"privateassets".msg = "A1: bbg-fetch is a leaf with no stack dependencies."

[tool.ruff.lint.flake8-tidy-imports]
# A3: an optional extra is imported inside a function and guarded, never at module level, so a
# core install keeps working. A module dedicated to a single optional backend is the documented
# exception and is named in per-file-ignores below.
banned-module-level-imports = ["yfinance", "pandas_datareader", "pybloqs", "plotly", "pyarrow",
                               "psycopg2", "sqlalchemy"]

[tool.ruff.lint.flake8-import-conventions.aliases]
# replaces ruff's default alias map, which also demands `matplotlib as mpl` everywhere. Only
# numpy and pandas are house convention; matplotlib is legitimately both `mpl` and `plt` here.
numpy = "np"
pandas = "pd"

[tool.ruff.lint.per-file-ignores]
"src/bbg_fetch/__init__.py" = ["F401"]      # intentional re-exports
"src/bbg_fetch/tests/*"     = ["F401", "F541"]  # live Bloomberg pytest modules

[tool.coverage.run]
source = ["bbg_fetch"]
omit = ["*/tests/*"]
